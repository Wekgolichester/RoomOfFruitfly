/* Layout: 화면 전체가 하나의 방. 유니코드로 그린 원근 방 + 노트이자 뉴런인 번호들. 노트를 열면 꾸밈 없는 기본 HTML 문서. */
:root {
  --room: #D8FF76;          /* 방 벽 색 (낮) */
  --ink: #1C2200;           /* 낮의 글자·선 */
  --ink-soft: #55661A;      /* 낮의 보조 글자 */
  --dark: #171D06;          /* 불 꺼진 방 */
  --glow: #D8FF76;          /* 밤에 켜지는 뉴런 */
  --glow-soft: rgba(216, 255, 118, 0.55);
  --paper: #FFFFFF;         /* 노트 문서 (브라우저 기본값 그대로) */
  --link: #0000EE;
  --visited: #551A8B;
  --font-ui: "Tangba Mono", "Apple SD Gothic Neo", "Noto Sans KR", ui-monospace, monospace;
  --font-mono: "Tangba Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-doc: "Tangba Mono", "Apple SD Gothic Neo", "Noto Sans KR", monospace;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--room);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 13px;
  line-height: 1.5;
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  transition: background-color .6s ease;
}
body.night { background: var(--dark); color: var(--glow); }

#room { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: manipulation; }
body.night #room { cursor: default; }
#room.on-node { cursor: pointer; }

.hud { position: fixed; z-index: 2; pointer-events: none; }
.hud > * { pointer-events: auto; }
.bl { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: max(18px, env(safe-area-inset-left, 0px)); }
.br { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); right: max(18px, env(safe-area-inset-right, 0px)); }
.br { display: flex; gap: 8px; align-items: center; }

.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
/* 버튼: 위·왼쪽 밝게, 오른쪽 중간, 아래 가장 어둡게 (옛날 HTML 버튼식) */
button.txt {
  font: inherit; font-family: var(--font-mono); font-size: 13px; color: #111; cursor: pointer;
  background: #CCCCCC; border: 0; border-radius: 0; padding: 7px 14px 8px;
  box-shadow: inset 0 3px 0 #ECECEC, inset 0 -3px 0 #5D5D5D, inset 3px 0 0 #ECECEC, inset -3px 0 0 #909090;
}
button.txt:hover { background: #D6D6D6; }
button.txt:active {
  background: #C2C2C2; padding: 8px 13px 7px 15px;
  box-shadow: inset 0 3px 0 #5D5D5D, inset 0 -3px 0 #ECECEC, inset 3px 0 0 #909090, inset -3px 0 0 #ECECEC;
}
/* Rule이 눌려 있으면(규칙 꺼짐) 어두운 올리브 + 연두 글자 */
#rulesBtn[aria-pressed="true"] {
  background: #3A4418; color: #D8FF76; padding: 8px 13px 7px 15px;
  box-shadow: inset 0 3px 0 #0B0D03, inset 0 -3px 0 #62722E, inset 3px 0 0 #262D0E, inset -3px 0 0 #62722E;
}
#rulesBtn[aria-pressed="true"]:hover { background: #445020; }
button.txt:focus-visible { outline: 1.5px dashed #111; outline-offset: -7px; }

/* 천장 전등: 캔버스에 그린 ◉ 위에 투명 버튼을 얹음 */
.lamp {
  position: fixed; z-index: 2; width: 44px; height: 44px; margin: -22px 0 0 -22px;
  padding: 0; border: 1px solid transparent; border-radius: 50%;
  background: transparent; color: var(--ink); cursor: pointer;
}
body.night .lamp { color: var(--glow); }
.lamp:hover, .lamp:focus-visible { border-color: currentColor; outline: none; }

.panel {
  position: fixed; z-index: 3;
  left: max(18px, env(safe-area-inset-left, 0px));
  bottom: calc(52px + env(safe-area-inset-bottom, 0px));
  width: min(440px, calc(100% - 36px)); box-sizing: border-box;
  max-height: calc(100% - 140px); overflow-y: auto;
  background: var(--room); color: var(--ink);
  border: 1px solid var(--ink);
  padding: 18px 20px;
  font-size: 13px;
}
.panel h2 { font-size: 15px; font-weight: 600; margin: 0 0 4px; text-wrap: balance; }
.panel h3 { font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
.panel p { margin: 0 0 10px; }
.panel dl { margin: 12px 0; display: grid; grid-template-columns: 3.2em 1fr; gap: 6px 10px; }
.panel dt { font-family: var(--font-mono); }
.panel dd { margin: 0; }
.panel .note { color: var(--ink-soft); font-size: 12px; border-top: 1px solid var(--ink-soft); padding-top: 10px; margin-top: 12px; }
.panel ol { margin: 0; padding: 0; list-style: none; columns: 2; column-gap: 16px; font-size: 12.5px; }
.panel ol li { break-inside: avoid; }
.panel ol a { color: var(--ink); }
.panel ol .n { font-family: var(--font-mono); color: var(--ink-soft); margin-right: 6px; }
.panel a:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 2px; }

.ask {
  position: fixed; z-index: 3; left: 50%; transform: translateX(-50%);
  bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  width: min(760px, calc(100% - 36px));
  text-align: center;
  transition: opacity 2.8s ease;
}
.ask.gone { opacity: 0; pointer-events: none; }
.ask .opts button { transition: opacity 0.9s ease; }
.ask .opts button.off { opacity: 0; }
.dream {
  position: fixed; z-index: 2; left: 50%; transform: translateX(-50%);
  bottom: calc(44px + env(safe-area-inset-bottom, 0px));
  width: max-content; max-width: min(760px, calc(100% - 36px));
  font-family: var(--font-mono); font-size: 12.5px; line-height: 1.55;
  text-align: center; text-wrap: balance; color: var(--ink-soft); pointer-events: none;
}
.dream b { font-weight: 600; color: var(--ink); }
.dream .noise { font-style: italic; opacity: 0.6; }
body.night .dream { color: var(--glow-soft); }
body.night .dream b { color: var(--glow); }
.ask .q { font-size: 17px; font-weight: 600; margin-bottom: 10px; text-wrap: balance; }
.ask .opts { display: flex; justify-content: center; gap: 8px 18px; flex-wrap: wrap; }
.ask .reply { margin-top: 10px; font-size: 13px; color: var(--glow-soft); text-wrap: balance; }

.toast {
  position: fixed; z-index: 4; left: 50%; transform: translateX(-50%);
  top: calc(64px + env(safe-area-inset-top, 0px));
  width: max-content; max-width: calc(100% - 36px);
  font-family: var(--font-mono); font-size: 12.5px;
  padding: 8px 12px; border: 1px solid currentColor;
  background: var(--room); color: var(--ink);
}
body.night .toast { background: var(--dark); color: var(--glow); }

/* ── 노트 문서: 일부러 브라우저 기본 스타일 그대로 ── */
#doc {
  position: fixed; inset: 0; z-index: 5;
  overflow-y: auto;
  background: var(--paper); color: #000;
  font-family: var(--font-doc); font-size: 16px; line-height: normal;
  padding-top: calc(8px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#doc a, #thumb a { color: var(--link); text-decoration: underline; }
#doc a.seen, #thumb a.seen { color: var(--visited); }
#doc a:active { color: #EE0000; }
#doc sup { font-size: 11px; color: #000; }
#doc hr { border: 0; border-top: 1px solid #808080; margin: 16px 0; }

#thumb {
  position: fixed; z-index: 6; pointer-events: none;
  width: 221px; height: 168px; overflow: hidden;
  background: var(--paper); color: #000;
  border: 1px solid #000;
}
#thumb .mini {
  width: 480px; transform: scale(0.46); transform-origin: 0 0;
  font-family: var(--font-doc); font-size: 16px; line-height: normal;
  padding: 8px; color: #000;
}

@media (max-width: 560px) {
  .name { font-size: 14px; }
    .panel ol { columns: 1; }
  .dream { bottom: calc(50px + env(safe-area-inset-bottom, 0px)); font-size: 11.5px; }
}
</style>
</head>

<script>
(() => {
  // ── 노트 = 뉴런. [[보이는 글|번호]] 가 하이퍼링크이자 배선 ──
  const DOCS = [
    { t: '질문', b: `뇌를 컴퓨터로 옮기면, 그 안에서도 [[꿈|1]]과 [[의식|20]]이 생길까?

이 질문을 세 갈래로 따라감. 꿈을 밖에서 [[읽는 시도|7]], 뇌를 통째로 [[복사하는 시도|11]], 살아 있는 뇌에 컴퓨터를 [[꽂는 시도|28]].

가장 앞서 있는 예시가 [[초파리|13]]라서 이 방의 주인공이 됨. 세 길 모두 아직 구조와 신호까지만 옮겼고, 경험까지 옮겨지는지는 아무도 확인 못 함.` },
    { t: '꿈', b: `꿈은 바깥 입력이 거의 끊긴 상태에서 뇌가 스스로 만들어내는 경험임.

생생한 꿈은 주로 [[REM 수면|2]] 때 나옴. 왜 꾸는지는 아직 합의가 없고 여러 [[가설|3]]이 있음.

이 정의를 그대로 옮기면, 입력이 끊긴 [[초파리|13]] 시뮬레이션 속 [[자발 발화|19]]도 꿈이라고 부를 수 있을까?` },
    { t: 'REM 수면', b: `잠은 깊은 잠과 REM 수면이 번갈아 돌아감. REM 동안 뇌는 깨어 있을 때처럼 활발한데 몸 근육은 거의 마비됨.

꿈이 가장 많은 REM은 잠든 지 90분쯤 지나야 시작돼서, [[꿈 해독 실험|8]]은 시간이 오래 걸림.

[[초파리의 잠|17]]에도 사람처럼 활동기와 정지기가 있음.`, src: [['Science News', 'https://sciencenews.org/article/dream-contents-deciphered-computer']] },
    { t: '꿈 가설들', b: `왜 꿈을 꾸는지에 대한 대표 가설:

- [[활성화-종합 가설|4]]: 무작위 신호를 이야기로 꿰맞춘 것
- [[기억 정리 가설|5]]: 낮의 경험을 밤에 재생해 굳히는 것
- [[원의식 가설|6]]: REM이 의식을 만들고 유지하는 것
- 예측 처리 가설: 뇌의 예측 모델을 점검하는 시간

서로 배타적이지 않고, 하나로 합의된 답은 없음. 모두 [[꿈|1]]을 다른 각도에서 설명함.` },
    { t: '활성화-종합 가설', b: `Hobson과 McCarley가 1977년에 제안함. 뇌간이 무작위로 신호를 쏘고, 대뇌가 그걸 이야기로 꿰맞춘 게 [[꿈|1]]이라는 설명.

이 설명대로라면, 이 방에서 불을 끈 뒤 보이는 [[자발 발화|19]]도 누군가 해석해 주면 꿈이 되는 걸까?` },
    { t: '기억 정리 가설', b: `낮에 겪은 걸 밤에 다시 재생하면서 장기 기억으로 굳힌다는 설명.

[[초파리|13]]에서도 비슷한 게 보임. 학습을 많이 한 초파리는 더 오래 자고, 잠을 못 자게 하면 학습 효과가 사라짐([[초파리의 잠|17]]).` },
    { t: '원의식 가설', b: `Hobson의 가설. REM 수면이 [[의식|20]]을 만들고 유지하는 데 필요하다고 봄. 그렇다면 REM을 보이는 동물은 의식이 있을 수도 있음.

van Swinderen 연구팀은 [[초파리|13]] 뇌로 이걸 실험 중임. 깨어 있음·잠·마취 상태를 비교하면서, 의식을 잃는다는 게 하드와이어된 예측으로 무너지는 것인지 묻고 있음.`, src: [['Templeton', 'https://www.templetonworldcharity.org/projects-resources/project-database/33970']] },
    { t: '꿈을 읽기', b: `지금 기술로 꿈을 영상처럼 녹화하는 건 아직 안 됨.

대신 꿈의 대략적인 범주를 맞히는 것([[가미타니 꿈 해독|8]]), 머릿속 이미지를 [[생성 AI로 복원|9]]하려는 것, [[자각몽 꾸는 사람과 신호를 주고받는 것|10]]까지는 실험으로 확인됨.

픽션은 훨씬 앞서 있음: [[블랙미러의 기억 재생|34]], [[매트릭스|33]].` },
    { t: '가미타니 꿈 해독 (2013)', b: `교토 ATR 연구소 팀이 잠든 사람의 뇌를 fMRI로 찍고, 깨워서 [[꿈|1]] 내용을 물어봄. 깨어 있을 때 같은 범주의 사진을 보여주며 뇌 패턴을 학습시킴.

정확도는 꿈 내용 예측 약 60%, 특정 시각 대상은 70% 이상이었음.

핵심 발견: 본 것과 꿈꾼 것이 뇌에서 비슷한 패턴을 만듦. 뇌 입장에서는 꿈도 깨어 있을 때만큼 진짜라는 것. [[매트릭스|33]]의 질문과 같음.`, src: [['Science News', 'https://sciencenews.org/article/dream-contents-deciphered-computer'], ['TBS News', 'https://www.tbsnews.net/node/970196']] },
    { t: '생성 AI 이미지 복원', b: `일본 QST 연구팀은 fMRI 해독기에 생성 AI를 붙여, 머릿속에 떠올린 이미지를 500번 반복 수정하며 복원함.

2026년 10월에는 이스라엘 와이즈만 연구소가 뇌 스캔만으로 보고 있는 이미지를 재구성하는 AI를 발표함. 최종 목표로 [[꿈|1]] 복원을 언급함.

방향이 반대인 시도도 있음. [[블라인드사이트|30]]는 뇌에서 이미지를 읽는 대신 뇌에 이미지를 씀.`, src: [['JST', 'https://sj.jst.go.jp/news/202401/n0115-01k.html'], ['MIT Technology Review', 'https://www.technologyreview.com/2026/10/01/1145588/ai-mind-reading-reconstructs-what-youre-looking-at/']] },
    { t: '자각몽 대화 (2021)', b: `미국·프랑스·독일·네덜란드의 4개 연구실이 36명을 재우고, 꿈인 걸 자각한 상태에서 소통을 시도함.

질문은 터치, 소리, 빛으로 보냈고 꿈꾸는 사람은 눈 움직임으로 답함. "8 빼기 6"을 묻자 눈을 좌우로 두 번 움직여 2라고 답한 참가자도 있었음. 다만 158번 시도 중 맞는 답은 18.4%.

[[꿈|1]]을 깬 뒤의 기억이 아니라, 꾸는 그 순간에 물어볼 수 있는 통로가 처음 생긴 것. 영화 인셉션의 아주 초기 버전.`, src: [['Vice', 'https://vice.com/en/article/scientists-achieve-real-time-communication-with-lucid-dreamers-in-breakthrough'], ['CNN 보도', 'https://ktvz.com/news/national-world/2021/02/18/real-time-talk-with-a-sleeping-person-is-possible-and-they-can-even-understand-it/']] },
    { t: '뇌를 복사하기', b: `뇌의 배선도인 [[커넥톰|12]]을 그려서 컴퓨터에서 돌리는 방향.

뇌 전체 배선도가 완성된 성체 동물은 아직 [[초파리|13]]뿐임. [[쥐|15]]와 [[인간|16]]은 1mm³ 조각까지 와 있음.

초파리 뇌는 이미 [[계산 모델로 돌아갔고|21]], [[가상 몸에도 붙었음|22]].` },
    { t: '커넥톰', b: `뇌 속 모든 뉴런과 그 사이 연결(시냅스)을 빠짐없이 그린 배선도. 뇌를 수천 장으로 썰어 전자현미경으로 찍고, AI와 사람이 뉴런 하나하나를 따라가며 복원함.

있는 것: 누가 누구와 연결됐는지, 연결 개수.
없는 것: 지금 어떤 뉴런이 켜져 있는지, 학습으로 변하는 과정, 분자 상태.

[[지하철 노선도|35]]로 치면 노선도는 있지만 열차 운행 기록은 없는 상태. 대표 사례는 [[FlyWire|14]].` },
    { t: '초파리', b: `이 방의 대표 예시. 성체 동물 중 뇌 전체 [[커넥톰|12]]이 완성된 건 초파리뿐임.

- 뇌 지도: [[FlyWire|14]]
- 뇌 + 척수 지도: [[BANC|18]]
- 지도를 돌려본 모델: [[Shiu 모델|21]]
- 몸을 붙인 시도: [[Eon Systems|22]]
- 화면 속 초파리: [[webgpu-fly|27]], [[DesktopFly|26]]
- 진짜 초파리의 잠: [[초파리의 잠|17]]
- 곤충에게 의식이 있나: [[뉴욕 선언|24]]` },
    { t: 'FlyWire (2024)', b: `2024년 10월 Nature에 발표된 성체 [[초파리|13]] 뇌 전체 지도. 뉴런 139,255개, 시냅스 5,450만 개.

76개 연구실, 287명 연구자, 시민 자원봉사자까지 참여해 손으로 교정함. 수많은 사람이 손으로 그린 뇌.

이 지도를 바탕으로 [[Shiu 모델|21]], [[Eon Systems|22]], [[webgpu-fly|27]], [[DesktopFly|26]]가 만들어짐. 그 뒤 척수까지 이은 게 [[BANC|18]].`, src: [['Inverse', 'https://www.inverse.com/health/complete-map-adult-fruit-fly-reveal-unsolved-mysteries-brain-neuroscience']] },
    { t: '쥐 MICrONS (2025)', b: `쥐 시각 피질 1mm³의 배선도. 쥐 뇌의 약 0.25%. 세포 20만 개 이상, 시냅스 5억 2,300만 개. 쌀알보다 작은 조각 안에 신경 전선이 약 4km 들어 있었음.

1979년 프랜시스 크릭은 1mm³의 정확한 배선도는 불가능하다고 했음. 46년 뒤 그 불가능이 가능해짐.

전체 [[커넥톰|12]]까지는 아직 멀고, [[인간|16]]은 더 멂.`, src: [['NIH', 'https://www.nih.gov/news-events/news-releases/scientists-map-unprecedented-detail-connections-visual-perception-mouse-brain'], ['GeekWire', 'https://www.geekwire.com/2025/brain-microns-wiring-diagram-connections/']] },
    { t: '인간 H01 (2024)', b: `Google과 하버드가 그린 인간 측두엽 피질 1mm³. 세포 약 5만 7천 개, 시냅스 약 1억 5천만 개.

이미지 데이터만 1.4페타바이트인데, 뇌 전체의 100만분의 1밖에 안 됨. 연구진은 [[쥐|15]] 뇌 전체만 해도 이것의 500배라고 밝힘.

[[블랙미러의 복사된 나|31]]가 상상한 '기억까지 통째로 복사'와는 아직 거리가 아주 멂.`, src: [['Google Research', 'https://research.google/blog/a-browsable-petascale-reconstruction-of-the-human-cortex/']] },
    { t: '초파리의 잠', b: `[[초파리|13]]는 하루 8~10시간쯤 잠. 사람처럼 활동기와 정지기가 있음([[REM 수면|2]]과 비교됨).

구애를 거절당하는 '학습'을 한 수컷은 40% 더 잤고, 잠을 못 자게 하면 학습 효과가 사라짐([[기억 정리 가설|5]]).

그런데 [[DesktopFly|26]]의 초파리를 재우는 건 뉴런이 아니라 코드임. 진짜 잠과 코드가 정한 잠은 뭐가 다를까?`, src: [['QBI', 'https://qbi.uq.edu.au/node/6786'], ['National Geographic', 'https://www.nationalgeographic.com/science/article/the-point-of-sleep-or-do-fruit-flies-dream-of-six-legged-sheep']] },
    { t: 'BANC (2026)', b: `2026년 6월 Nature에 발표된 [[초파리|13]]의 뇌 + 척수(복부신경삭) 통합 [[커넥톰|12]]. 뉴런 158,262개.

결론: 위에서 명령을 내리는 '결정 뉴런'이 없음. 제어 회로가 뇌와 척수 전체에 퍼져 있고, 척수에서도 상당한 처리가 일어남.

[[관제실 없는 지하철|35]]인 셈. 중앙이 없다면 [[의식|20]]은, '나'는 어디에 있을까?`, src: [['CASRAI', 'https://casrai.org/news/fruit-fly-connectome-no-central-command']] },
    { t: '자발 발화', b: `바깥 입력이 없어도 뉴런이 혼자 발화하는 것. 이 방에서 불을 끄면 보이는 장면.

이걸 [[꿈|1]]이라고 불러야 할까, 노이즈라고 불러야 할까? [[활성화-종합 가설|4]]대로라면 해석하는 누군가가 있을 때 꿈이 됨.

그 '누군가'가 [[의식|20]]의 문제임.` },
    { t: '의식', b: `의식에는 보편적으로 합의된 정의가 없음.

컴퓨터 안의 뇌에 대해서는 두 이론이 정반대로 답함. [[통합정보이론|23]]은 "없다", [[기능주의|25]]는 "있을 수 있다".

동물에 대해서는 [[뉴욕 선언|24]]이 곤충까지 가능성을 열어둠. [[원의식 가설|6]]은 [[꿈|1]]과 의식을 묶어서 봄. 이 방의 [[질문|0]]이 결국 여기로 모임.` },
    { t: 'Shiu 모델 (2024)', b: `Phil Shiu가 [[FlyWire|14]] 커넥톰으로 만든 초파리 뇌 계산 모델. 맛·촉각 자극이 들어오면 어떤 뉴런이 켜질지 정확히 예측함. 노트북에서 돌아감.

다만 몸이 없는 뇌였음. 그 뇌에 몸을 붙인 게 [[Eon Systems|22]]. 브라우저 버전은 [[webgpu-fly|27]].`, src: [['UC Berkeley', 'https://vcresearch.berkeley.edu/news/researchers-simulate-fly-brain-laptop-human-brain-next']] },
    { t: 'Eon Systems (2026)', b: `2026년 3월, 초파리 [[커넥톰|12]] 뇌를 물리 엔진 속 가상 초파리 몸에 연결했다고 발표한 스타트업. 걷기, 그루밍, 먹이 찾기가 행동별 코드 없이 신경 활동에서 나왔다고 주장함.

주의: 공개된 코드는 [[Shiu 모델|21]] 기반이고, 정작 새로운 뇌-몸 연결 부분은 미공개 상태.

다음 목표는 뉴런 7천만 개짜리 [[쥐|15]] 뇌, 그다음은 인간. [[블랙미러의 복사된 나|31]]가 떠오르는 지점.`, src: [['The Decoder', 'https://the-decoder.com/startup-claims-first-full-brain-emulation-of-a-fruit-fly-in-a-simulated-body/'], ['Cybernews', 'https://cybernews.com/ai-news/digital-fruit-fly-brain-simulation/']] },
    { t: '통합정보이론 (IIT)', b: `토노니와 코흐의 이론. [[의식|20]]은 물리적 부품들이 서로 얼마나 통합된 인과 구조를 이루느냐에 달려 있다고 봄.

그래서 일반 컴퓨터로 돌린 뇌 시뮬레이션은 뉴런 하나하나를 완벽히 복사해도 경험이 없다고 봄. 뇌와 비슷한 연결을 가진 뉴로모픽 칩이라면 가능.

이 이론으로 보면 [[Eon|22]]의 초파리 안에도, 이 방 안에도 아무도 없음. 반대 입장은 [[기능주의|25]].`, src: [['arXiv', 'https://arxiv.org/abs/2412.04571v2'], ['PMC', 'https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4574706/']] },
    { t: '동물 의식 뉴욕 선언 (2024)', b: `2024년 4월 뉴욕대에서 발표됨. 곤충을 포함한 여러 무척추동물에게 의식 경험의 '현실적 가능성'이 있다고 밝힘.

그리고 그런 가능성이 있다면, 그 동물에 영향을 주는 결정에서 무시하는 건 무책임하다고 덧붙임.

이 원칙을 시뮬레이션 [[초파리|13]]에도 적용해야 할까? [[블랙미러 '플레이싱'|32]]이 던진 질문과 같음.`, src: [['Silene', 'https://www.silene.ong/en/news/the-new-york-declaration-on-animal-consciousness'], ['Quanta', 'https://www.quantamagazine.org/insects-and-other-animals-have-consciousness-experts-declare-20240419/']] },
    { t: '기능주의', b: `[[의식|20]]은 시스템이 하는 계산과 기능이라는 입장. 같은 계산이면 같은 마음이고, 실리콘이냐 세포냐는 상관없음.

이 입장으로 보면 [[커넥톰|12]]대로 정확히 돌아가는 초파리 시뮬레이션 안에는 누군가 있을 수도 있음. 반대 입장은 [[통합정보이론|23]].` },
    { t: 'DesktopFly (2026)', b: `맥 바탕화면 위를 날아다니는 3D 초파리. [[FlyWire|14]]에서 뉴런 668개, 연결 18,968개짜리 회로만 잘라 씀. 커서가 다가오면 탈출 뉴런 쪽으로 신호가 가서 날아감.

밤에 컴퓨터가 쉬면 잠들고 깨면 그루밍함. 그런데 제작자가 밝히길, 잠·비행·그루밍은 뉴런이 아니라 애니메이션과 상태 규칙임.

이 초파리를 재우는 건 668개 뉴런이 아니라 "밤이면 재워라"라는 코드. [[진짜 초파리의 잠|17]]과 비교해볼 것. 이 방의 점선(내가 짠 규칙)도 같은 문제를 안고 있음.`, src: [['GitHub', 'https://github.com/DenisSergeevitch/desktop-fly']] },
    { t: 'webgpu-fly', b: `브라우저 탭에서 초파리 뇌(뉴런 139,255개)와 척수(23,188개)를 돌리는 웹 데모. 키를 누르면 진짜 뉴런이 발화하고 신호가 배선을 따라 퍼져서 초파리가 걸음.

제작자가 경계를 직접 밝힘. 뇌와 척수는 배선이 아니라 '이름'으로 이었음. 두 지도가 암컷 뇌와 수컷 척수라는 서로 다른 개체에서 나왔기 때문. 다리 리듬도 손으로 짠 코드.

[[Shiu 모델|21]] 기반. 웹이라는 매체로 할 수 있는 최대치의 선례.`, src: [['webgpu-fly', 'https://abgunaydin-webgpu-fly.static.hf.space/index.html']] },
    { t: '뇌에 접속하기', b: `[[뇌를 복사하기|11]]와 반대 방향. 살아 있는 뇌에 컴퓨터를 꽂는 뇌-컴퓨터 인터페이스(BCI).

대표는 [[뉴럴링크|29]]. 지금은 대부분 뇌에서 신호를 '읽는' 단계이고, 뇌에 '쓰는' 첫 시도가 [[블라인드사이트|30]].

혈관으로 넣는 Synchron, 뇌 표면에 필름을 붙이는 Precision Neuroscience 같은 다른 방식도 있음.`, src: [['Timewell', 'https://timewell.jp/en/columns/neuralink-precision-neuroscience-synchron-blackrock-neurotech']] },
    { t: '뉴럴링크', b: `2026년 1월 기준 임상시험 참가자 21명. 동전만 한 23mm 기기에 전극이 최대 3,072개.

마비 환자가 생각만으로 커서를 움직이고, 가상 키보드로 분당 최대 40단어를 입력하고, 로봇 팔로 혼자 밥을 먹음. 회사는 기기 관련 심각한 부작용이 0건이라고 밝힘.

지금 읽는 건 주로 운동 의도라서 [[꿈|1]]이나 [[의식|20]]과는 거리가 멂. 머스크는 결국 인간 뇌와 AI의 공생을 말함. [[매트릭스|33]]의 플러그를 떠올리게 하는 지점.`, src: [['Reuters', 'https://whbl.com/2026/01/28/elon-musks-neuralink-says-it-has-21-participants-enrolled-in-trials/'], ['Mezha', 'https://mezha.ua/en/news/neuralink-telepathy-2-years-of-tests-308110/amp/']] },
    { t: '블라인드사이트', b: `[[뉴럴링크|29]]의 시각 복원 장치. 카메라 영상을 받아 뇌의 시각 피질을 직접 자극해서, 눈이나 시신경을 잃은 사람도 이미지를 지각하게 하려는 것.

머스크 스스로 첫 화질을 저해상도 '아타리 그래픽' 수준이라고 표현함. 2026년 1월 기준 첫 인간 이식을 준비 중이었고, 그 뒤 실제 이식 여부는 확인 못 함.

뇌에 직접 들어온 이미지는 '본 것'일까 '꿈꾼 것'일까? [[가미타니 꿈 해독|8]]에 따르면 뇌 입장에서는 둘 다 진짜 경험.`, src: [['CXO Digital Pulse', 'https://www.cxodigitalpulse.com/neuralinks-blindsight-aims-to-restore-vision-first-human-implant-planned-for-2025'], ['Storyboard18', 'https://storyboard18.com/digital/neuralink-readies-first-human-implant-of-vision-restoring-blindsight-device-88432.htm']] },
    { t: '블랙미러: 복사된 나', b: `'화이트 크리스마스'(2014): 사람의 의식을 복사한 '쿠키'를 기기에 넣어 비서로 부림. 복사본은 자기가 진짜라고 느낌.

'USS 칼리스터'(2017): 동료들의 디지털 복제인간을 게임 속에 가둠. '샌 주니페로'(2016): 죽기 전 의식을 시뮬레이션 마을에 업로드함.

이 작품들은 기억과 성격까지 통째로 복사된다고 가정함. 실제로는 [[초파리|13]]조차 배선도([[커넥톰|12]])만 복사됐고, 기억이 담긴 연결의 세기와 분자 상태는 아직 못 옮김.` },
    { t: '블랙미러 \'플레이싱\' (2025)', b: `게임 'Thronglets' 속 생명체가 세계 최초로 감각을 지닌 디지털 생명이라는 이야기. 주인공은 지인이 그들을 장난으로 죽이자 그를 살해하고, 수십 년 뒤엔 자기 뇌에 포트를 심어 직접 연결함([[뉴럴링크|29]]의 극단).

화면 속 생명이 진짜로 느낀다면, 그걸 지우는 건 무엇인가? [[뉴욕 선언|24]]의 "가능성이 있다면 무시하지 말라"는 원칙과 맞닿음. 이 방의 불을 끄는 버튼도 같은 질문을 품고 있음.`, src: [['Wikipedia', 'https://en.wikipedia.org/wiki/Plaything_(Black_Mirror)']] },
    { t: '매트릭스 (1999)', b: `너무 생생한 [[꿈|1]]에서 깨어나지 못하면, 꿈과 현실을 어떻게 구분할까? 인간은 기계에 연결된 채 시뮬레이션 세계를 현실로 경험함.

뒤통수 플러그로 기계가 뇌에 세계 전체를 '써 넣음'. 현실의 [[뉴럴링크|29]]는 읽기에서 [[블라인드사이트|30]]의 쓰기로 이제 막 넘어가려는 단계.

[[가미타니|8]]의 발견처럼, 뇌 입장에서는 입력이 진짜든 가짜든 경험은 똑같이 진짜임.` },
    { t: '블랙미러: 읽히는 내면', b: `'당신의 모든 역사'(2011): 귀 뒤의 칩이 모든 경험을 녹화하고 언제든 재생함. [[꿈을 읽기|7]]의 최종 목표를 기억 버전으로 먼저 보여준 셈.

'크로커다일'(2017): 기계로 목격자의 기억을 화면에 띄움. 기억이 흐릿하게 재생되는 장면이 현실적임. 실제 [[꿈 해독|8]]도 선명한 영상이 아니라 대략의 범주를 확률로 내놓는 수준이기 때문.

내면이 읽히는 순간, 그건 여전히 나만의 것일까?` },

  const SPEED = reduce ? 0.35 : 1;

  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const seed = mulberry32(20261020);

  // 노트의 제자리 (불 끄면 돌아가는 곳). 00 질문은 방 한가운데.
  const nodes = [];
  nodes.push({ hx: 0.5, hy: 0.46 });
  for (let tries = 0; nodes.length < N && tries < 30000; tries++) {
    const hx = 0.05 + seed() * 0.9, hy = 0.13 + seed() * 0.72;
    let ok = true;
    for (const n of nodes) { const dx = (n.hx - hx) * 1.7, dy = n.hy - hy; if (dx * dx + dy * dy < 0.011) { ok = false; break; } }
    if (ok) nodes.push({ hx, hy });
  }
  while (nodes.length < N) nodes.push({ hx: 0.1 + seed() * 0.8, hy: 0.15 + seed() * 0.7 });
  nodes.forEach((n, i) => Object.assign(n, {
    id: i, kind: KIND[i], label: pad(i), x: 0, y: 0, vx: 0, vy: 0, v: seed() * 0.4, last: -9,
    size: 11 + Math.min(8, Math.round(deg[i] * 0.5)),
    jw: 0.85 + (i * 7919 % 97) / 97 * 0.45, jh: 0.9 + (i * 104729 % 89) / 89 * 0.25,   // 같은 종류도 길이가 조금씩 다름
  }));

  const edges = [];
  const out = DOCS.map(() => []);
  outLinks.forEach((arr, i) => arr.forEach(j => { out[i].push(edges.length); const w = 0.3 + seed() * 0.5; edges.push({ a: i, b: j, w, w0: w, learn: 0, per: 5 + Math.random() * 5, ph: Math.random() * 10 }); }));
  // 링크 세기 0.3~0.8: 신호 하나로는 상대를 못 켜고, 여러 개가 겹쳐야 켜짐
  const pairKey = (a, b) => a < b ? a * 1000 + b : b * 1000 + a;
  const pairEdges = new Map();
  edges.forEach(e => { const k = pairKey(e.a, e.b); if (!pairEdges.has(k)) pairEdges.set(k, []); pairEdges.get(k).push(e); });

  let W = 0, H = 0, DPR = 1, roomDay = null, roomNight = null;
  let night = false, nightSince = 0, simT = 0, fires = 0, firesNight = 0, askedThisNight = false;
  let hover = null, hoverEmit = 0, hoverConnT = -99, hoverStart = 0, hoverLogged = false;
  let rules = true;                                   // 내가 짠 규칙 (날기, 부딪힘, 꿈 재생, 저절로 잠들기)
  const path = [];                                    // 읽은 길
  // 켜진 번호의 노트에서 어절을 하나씩 뽑아 문장처럼 이어 붙임
  const WORDS = DOCS.map(d => (d.t + ' ' + d.b.replace(/\[\[([^|\]]+)\|\d+\]\]/g, '$1'))
    .replace(/^- /gm, '').split(/\s+/)
    .map(w => w.replace(/^[\s"'‘’“”(\[→·:,.\-]+|[\s"'‘’“”)\]→·:,.;!?\-]+$/g, ''))
    .filter(w => w.length >= 2 && !/^https?:|^\d+$/.test(w)));
  const wq = [];                                      // 발화 대기열
  let sent = [], sentLen = 7, sentDone = false, nextWordT = 0;
  let dream = null;                                   // 밤에 재생 중인 꿈
  const spikes = [], ripples = [], pairCool = new Map(), conns = new Map();

  // ── 유니코드로 그린 방 ───────────────────────────
  function buildRoom(color, lamp) {
    const c = document.createElement('canvas');
    c.width = Math.round(W * DPR); c.height = Math.round(H * DPR);
    const g = c.getContext('2d');
    g.scale(DPR, DPR);
    const rng = mulberry32(7);                 // 어긋남도 매번 같게
    const fs = W < 600 ? 11 : 13;
    g.fillStyle = color; g.textAlign = 'center'; g.textBaseline = 'middle';

    const bx0 = W * (W < 600 ? 0.17 : 0.25), bx1 = W - bx0, by0 = H * 0.24, by1 = H * 0.68;

    // 가운데 벽: 간격 있는 ㅡ ㅡ ㅡ / ㅣ ㅣ ㅣ
    g.font = `${fs}px ${KR}`;
    const hw = g.measureText('ㅡ').width || fs;
    const hstep = hw * 1.3, vstep = fs * 1.35;
    const dashH = (x0, x1, y) => { const n = Math.max(1, Math.round((x1 - x0) / hstep)); for (let i = 0; i <= n; i++) g.fillText('ㅡ', x0 + (x1 - x0) * i / n, y); };
    const dashV = (x, y0, y1, from = 1, cut = 1) => { const n = Math.max(2, Math.round((y1 - y0) / vstep)); for (let i = from; i <= n - cut; i++) g.fillText('ㅣ', x, y0 + (y1 - y0) * i / n); };
    dashH(bx0, bx1, by0); dashH(bx0, bx1, by1);
    dashV(bx0, by0, by1); dashV(bx1, by0, by1);

    // 옆 선: 한 방향 기호만, 살짝 어긋난 간격으로
    g.font = `${fs}px ${MONO}`;
    const diag = (x0, y0, x1, y1) => {
      const dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy);
      const ch = (dx > 0) === (dy > 0) ? '╲' : '╱';
      const nx = -dy / len, ny = dx / len;
      for (let s = 0; s <= len - fs * 0.8;) {
        const t = s / len, off = (rng() - 0.5) * 2.6;
        g.fillText(ch, x0 + dx * t + nx * off, y0 + dy * t + ny * off);
        s += fs * (0.78 + rng() * 0.42);
      }
    };
    diag(0, 0, bx0, by0); diag(W, 0, bx1, by0);
    diag(0, H * 0.88, bx0, by1); diag(W, H * 0.88, bx1, by1);

    // 천장 전등
    g.font = `${fs}px ${KR}`;
    dashV(W / 2, 0, by0 * 0.42, 0, 1);
    g.font = `${Math.round(fs * 1.8)}px ${KR}`;
    g.fillText(lamp, W / 2, by0 * 0.42);
    return c;
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const oldW = W, oldH = H;
    W = window.innerWidth; H = window.innerHeight;
    cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    lampBtn.style.left = (W / 2) + 'px'; lampBtn.style.top = (H * 0.24 * 0.42) + 'px';
    roomDay = buildRoom(C.ink, '◉');
    roomNight = buildRoom('rgba(216,255,118,0.42)', '◌');
    nodes.forEach(n => {
      if (!oldW) { n.x = n.hx * W + (Math.random() - 0.5) * 120; n.y = n.hy * H + (Math.random() - 0.5) * 80; }
      else { n.x = n.x / oldW * W; n.y = n.y / oldH * H; }
    });
  }

  // ── 뉴런 모델: 새는 적분-발화 (아주 단순화) ─────────
  const LEAK = 0.7, REFRACT = 0.35, SPIKE_SPEED = 240;
  // 연결은 이어졌다가 life초 뒤에 점점 끊어짐 (BREAK초 동안 점선으로 갈라지며 사라짐)
  const BREAK = 0.7;
  function connect(a, b, delay, life, alpha, lw, dash) {
    const k = (dash ? 'c' : '') + (a < b ? a * 1000 + b : b * 1000 + a);
    conns.set(k, { a: nodes[a], b: nodes[b], t0: simT + delay, life, alpha, lw, dash: !!dash });
  }
  function connectHover() {
    if (!hover) return;
    hoverConnT = simT;
    const h = hover.id, hub = deg[h] >= HUB;
    const first = [...new Set([...outLinks[h], ...inLinks[h]])];
    first.forEach((j, i) => connect(h, j, i * 0.05, hub ? 2.8 : 2.2, 0.85, hub ? 0.9 : 0.6));
    if (hub) for (const j of first) for (const k of new Set([...outLinks[j], ...inLinks[j]])) {
      if (k !== h) connect(j, k, 0.3 + Math.random() * 0.3, 1.6, 0.3, 0.5);
    }
  }
  function fire(n, noLine) {
    n.v = 0; n.last = simT; fires++;
    if (wq.length < 6) wq.push(n.id);
    if (night) firesNight++;
    for (const ei of out[n.id]) {
      const e = edges[ei], b = nodes[e.b];
      const d = Math.hypot(b.x - n.x, b.y - n.y);
      spikes.push({ e, t0: simT, dur: Math.min(1.4, Math.max(0.12, d / SPIKE_SPEED)) });
      if (!noLine) connect(e.a, e.b, 0, 1.2, 0.5, 0.6);
    }
  }

  // ── 읽은 길 → 밤의 꿈 ───────────────────────
  const shortT = i => DOCS[i].t.replace(/\s*\([^)]*\)/g, '').trim();
  function remember(i, quiet) {
    const prev = path[path.length - 1];
    if (prev === i) return;
    if (prev !== undefined) {
      const es = pairEdges.get(pairKey(prev, i));
      if (es) for (const e of es) { e.learn = Math.min(6, e.learn + 1); e.w = Math.min(Math.max(e.w0, 0.88), e.w0 + e.learn * 0.12); }   // 같이 켜진 연결은 강해짐 (신호 하나로 혼자 발화시키지는 못하게)
      if (!quiet) connect(prev, i, 0, 2.6, 0.9, es ? 1.4 : 1, !es);
    }
    path.push(i); if (path.length > 40) path.shift();
    nodes[i].mem = (nodes[i].mem || 0) + 1;
    if (!quiet) { try { localStorage.setItem('lights-out-room:path', JSON.stringify(path)); } catch (_) {} renderDream(); }
  }
  function loadPath() {
    let saved = [];
    try { saved = JSON.parse(localStorage.getItem('lights-out-room:path') || '[]'); } catch (_) {}
    if (Array.isArray(saved)) saved.filter(i => Number.isInteger(i) && i >= 0 && i < N).forEach(i => remember(i, true));
    renderDream();
  }
  function forgetPath() {
    path.length = 0;
    nodes.forEach(n => { n.mem = 0; });
    edges.forEach(e => { e.learn = 0; e.w = e.w0; });
    try { localStorage.removeItem('lights-out-room:path'); } catch (_) {}
    renderDream();
  }
  // 꿈 = 읽은 길을 2~3개씩 끊어 뒤섞고, 가끔 거꾸로, 가끔 길에 없던 노트가 끼어듦. 돌수록 더 흐려짐.
  function buildDream() {
    const cycle = dream ? dream.cycle + 1 : 0;
    const noiseP = Math.min(0.6, 0.2 + cycle * 0.12);
    const src = path.slice(-14);
    const seq = [];
    if (src.length >= 2) {
      const chunks = [];
      for (let i = 0; i < src.length;) {
        const k = 2 + (Math.random() < 0.5 ? 1 : 0);
        const c = src.slice(i, i + k);
        if (Math.random() < 0.3) c.reverse();
        chunks.push(c); i += k;
      }
      chunks.sort(() => Math.random() - 0.5);
      for (const c of chunks) for (const id of c) {
        seq.push({ id, noise: false });
        if (Math.random() < noiseP) {
          const nb = [...outLinks[id], ...inLinks[id]];
          const j = nb.length && Math.random() < 0.65 ? nb[Math.floor(Math.random() * nb.length)] : Math.floor(Math.random() * N);
          seq.push({ id: j, noise: true });
        }
      }
    } else {
      for (let k = 0; k < 8; k++) seq.push({ id: Math.floor(Math.random() * N), noise: true });
    }
    dream = {
      seq, idx: 0, nextT: simT + 1.2, cycle, fromPath: src.length >= 2,
      log: dream ? dream.log : [], prev: dream ? dream.prev : null, count: dream ? dream.count : 0,
    };
  }
  function dreamStep(render) {
    if (dream.idx >= dream.seq.length) buildDream();
    const s = dream.seq[dream.idx++];
    const n = nodes[s.id];
    if (dream.prev !== null && dream.prev !== s.id) {
      const linked = pairEdges.has(pairKey(dream.prev, s.id));
      if (render) connect(dream.prev, s.id, 0, 2.2, 0.85, linked ? 1.3 : 0.9, !linked);   // 배선에 없는 도약은 점선
    }
    fire(n); n.dreamT = simT;
    dream.prev = s.id; dream.count++;
    dream.log.push(s); if (dream.log.length > 9) dream.log.shift();
    dream.nextT = simT + 1.1 + Math.random() * 0.7;
    if (render) renderDream();
  }

  function step(dt, render) {
    simT += dt;
    const decay = Math.exp(-dt / LEAK);
    const kick = (night ? 0.085 : 0.03) * dt;   // 입력 없이 생기는 자발 활동
    for (const n of nodes) {
      n.v *= decay;
      if (Math.random() < kick) n.v += 0.5 + Math.random() * 0.6;
      if (n.v >= 1 && simT - n.last > REFRACT) fire(n);
    }
    for (let i = spikes.length - 1; i >= 0; i--) {
      const s = spikes[i];
      if (simT >= s.t0 + s.dur) { nodes[s.e.b].v += s.e.w; spikes.splice(i, 1); }
    }
    // 올려둔 노트는 낮 동안 주기적으로 링크를 따라 신호를 보냄. 링크가 많을수록 자주.
    if (render && hover && !night && rules) {
      const every = Math.max(0.35, 1.1 - deg[hover.id] * 0.06);
      if (simT - hoverEmit > every) { hoverEmit = simT; fire(hover, true); }
    }
    if (render && hover && simT - hoverConnT > 4.2) connectHover();   // 끊어진 뒤 잠깐 쉬고 다시 이어짐
    if (render && hover && !hoverLogged && performance.now() - hoverStart > 1000) { hoverLogged = true; remember(hover.id); }
    if (night && rules && dream && simT >= dream.nextT) dreamStep(render);   // 밤: 읽은 길을 다시 재생
    if (render) wordTick();
    // 움직임
    const damp = Math.pow(night ? 0.86 : 0.94, dt * 60);
    const top = 64, bottom = H - 64;
    for (const n of nodes) {
      if (n === hover && render) { n.vx = 0; n.vy = 0; continue; }   // 잡힌 초파리
      if (!rules) {
        // 규칙 없음: 아무 힘도 안 받고 서서히 멈춤
      } else if (night) {
        const tx = n.hx * W, ty = n.hy * H;
        n.vx += (tx - n.x) * 2.2 * dt; n.vy += (ty - n.y) * 2.2 * dt;
        n.vx += (Math.random() - 0.5) * 16 * dt; n.vy += (Math.random() - 0.5) * 16 * dt;
      } else {
        n.vx += (Math.random() - 0.5) * 1500 * dt * SPEED;
        n.vy += (Math.random() - 0.5) * 1500 * dt * SPEED;
        if (Math.random() < 0.55 * dt) {              // 초파리처럼 갑자기 방향을 틀어 휙 날아감
          const a = Math.random() * Math.PI * 2, sp = (220 + Math.random() * 220) * SPEED;
          n.vx = Math.cos(a) * sp; n.vy = Math.sin(a) * sp;
        }
        const m = Math.hypot(n.vx, n.vy), cap = 440 * SPEED;
        if (m > cap) { n.vx *= cap / m; n.vy *= cap / m; }
      }
      n.vx *= damp; n.vy *= damp;
      n.x += n.vx * dt; n.y += n.vy * dt;
      if (!night) {
        if (n.x < 18) { n.x = 18; n.vx = Math.abs(n.vx); }
        if (n.x > W - 18) { n.x = W - 18; n.vx = -Math.abs(n.vx); }
        if (n.y < top) { n.y = top; n.vy = Math.abs(n.vy); }
        if (n.y > bottom) { n.y = bottom; n.vy = -Math.abs(n.vy); }
      }
    }
    // 낮의 충돌 → 점선 연결 (내가 짠 규칙)
    if (!night && rules) {
      for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
        const a = nodes[i], b = nodes[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        if (dx * dx + dy * dy < 22 * 22) {
          const key = i * 100 + j;
          if (simT - (pairCool.get(key) || -9) < 1.2) continue;
          pairCool.set(key, simT);
          a.v += 0.3; b.v += 0.3;
          if (render) connect(i, j, 0, 1.2, 0.7, 0.6, true);
        }
      }
    }
    if (night && !askedThisNight && simT - nightSince > 7) { askedThisNight = true; showAsk(); }
  }

  // ── 그리기 ──────────────────────────────────
  function line(a, b) { ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); }
  function shapePath(kind, x, y, r, inner, keep) {
    if (!keep) ctx.beginPath();
    switch (kind) {
      case 'meta': {                                // 노선도의 역 표시
        ctx.arc(x, y, r, 0, Math.PI * 2);
        if (inner) break;
        const t = r * 0.55;
        ctx.moveTo(x - r - t, y); ctx.lineTo(x - r, y);
        ctx.moveTo(x + r, y); ctx.lineTo(x + r + t, y);
        ctx.moveTo(x, y - r - t); ctx.lineTo(x, y - r);
        ctx.moveTo(x, y + r); ctx.lineTo(x, y + r + t);
        break;
      }
      case 'bio':
        for (let k = 0; k < 6; k++) {
          const a = k * Math.PI / 3, px = x + Math.cos(a) * r * 1.1, py = y + Math.sin(a) * r * 1.1;
          if (k) ctx.lineTo(px, py); else ctx.moveTo(px, py);
        }
        ctx.closePath(); break;
      case 'theory':
        ctx.moveTo(x, y - r * 1.15); ctx.lineTo(x + r * 1.3, y); ctx.lineTo(x, y + r * 1.15); ctx.lineTo(x - r * 1.3, y); ctx.closePath(); break;
      case 'study':
        ctx.rect(x - r * 0.85, y - r * 0.85, r * 1.7, r * 1.7); break;
      case 'data': {                                // 겹쳐 쌓인 종이
        const h = r * 0.85;
        if (inner) { ctx.rect(x - h, y - h, h * 2, h * 2); break; }
        ctx.moveTo(x - h + 3, y - h - 3); ctx.lineTo(x + h + 3, y - h - 3); ctx.lineTo(x + h + 3, y + h - 3); ctx.lineTo(x + h + 3, y - h - 3); ctx.closePath();
        ctx.rect(x - h, y - h, h * 2, h * 2);
        break;
      }
      case 'model': {
        const w = r * 2.3, h = r * 1.44, rad = 4, x0 = x - w / 2, y0 = y - h / 2;
        ctx.moveTo(x0 + rad, y0);
        ctx.arcTo(x0 + w, y0, x0 + w, y0 + h, rad); ctx.arcTo(x0 + w, y0 + h, x0, y0 + h, rad);
        ctx.arcTo(x0, y0 + h, x0, y0, rad); ctx.arcTo(x0, y0, x0 + w, y0, rad); ctx.closePath(); break;
      }
      case 'device':
        ctx.moveTo(x, y - r * 1.25); ctx.lineTo(x + r * 1.3, y + r * 0.9); ctx.lineTo(x - r * 1.3, y + r * 0.9); ctx.closePath(); break;
      case 'fiction': {                             // 화면처럼 기울어진 평행사변형
        const k = r * 0.45;
        ctx.moveTo(-r * 1.1 + k + x, y - r * 0.75); ctx.lineTo(r * 1.1 + k + x, y - r * 0.75);
        ctx.lineTo(r * 1.1 - k + x, y + r * 0.75); ctx.lineTo(-r * 1.1 - k + x, y + r * 0.75); ctx.closePath(); break;
      }
      default:                                      // q, concept
        ctx.arc(x, y, r, 0, Math.PI * 2);
    }
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = night ? C.dark : C.room;
    ctx.fillRect(0, 0, W, H);
    ctx.drawImage(night ? roomNight : roomDay, 0, 0, W, H);

    const col = night ? 'rgba(216,255,118,' : 'rgba(28,34,0,';
    // 링크 지도: 밤엔 전부, 낮엔 읽은 길로 굵어진 링크만. 선마다 제 주기로 이어졌다가 끊어짐.
    for (const e of edges) {
      if (!night && !e.learn) continue;
      const t = (simT + e.ph) % e.per, up = e.per * (e.learn ? 0.7 : 0.55);
      if (t > up + BREAK) continue;                            // 끊어진 채 쉬는 구간
      const grow = Math.min(1, t / 0.3);
      const br = Math.max(0, (t - up) / BREAK);
      const a = nodes[e.a], b = nodes[e.b];
      ctx.lineWidth = 0.5 + Math.min(1.5, e.learn * 0.3);
      ctx.strokeStyle = col + (Math.min(0.5, (night ? 0.14 : 0.2) + e.learn * 0.07) * (1 - br)).toFixed(3) + ')';
      ctx.setLineDash(br > 0 ? [4, 1 + br * 14] : []);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(a.x + (b.x - a.x) * grow, a.y + (b.y - a.y) * grow); ctx.stroke();
    }
    ctx.setLineDash([]);

    // 올려둔 노트와 이웃
    const near = new Set();
    if (hover) { for (const j of outLinks[hover.id]) near.add(j); for (const j of inLinks[hover.id]) near.add(j); }

    // 이어졌다가 끊어지는 연결 (실선 = 링크, 점선 = 충돌 규칙)
    for (const [k, c] of conns) {
      const age = simT - c.t0;
      if (age < 0) continue;
      if (age > c.life + BREAK) { conns.delete(k); continue; }
      const grow = Math.min(1, age / 0.2);
      const br = Math.max(0, (age - c.life) / BREAK);       // 0→1: 끊어지는 중
      ctx.lineWidth = c.lw;
      ctx.strokeStyle = col + (c.alpha * (1 - br)).toFixed(3) + ')';
      ctx.setLineDash(c.dash ? [3, 4 + br * 12] : (br > 0 ? [4, 1 + br * 14] : []));
      ctx.beginPath();
      ctx.moveTo(c.a.x, c.a.y);
      ctx.lineTo(c.a.x + (c.b.x - c.a.x) * grow, c.a.y + (c.b.y - c.a.y) * grow);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    // 링크 위를 달리는 신호
    ctx.font = `13px ${MONO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = night ? C.room : C.ink;
    for (const s of spikes) {
      const a = nodes[s.e.a], b = nodes[s.e.b];
      const p = Math.min(1, (simT - s.t0) / s.dur);
      ctx.fillText('•', a.x + (b.x - a.x) * p, a.y + (b.y - a.y) * p);
    }

    // 빛 자극 파문
    ctx.setLineDash([2, 5]);
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i], age = simT - r.t0;
      if (age > 0.8) { ripples.splice(i, 1); continue; }
      ctx.strokeStyle = col + (0.7 * (1 - age / 0.8)).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(r.x, r.y, 20 + age * 160, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.setLineDash([]);

    // 번호 = 기본 HTML 버튼처럼 얇은 입체 테두리 (왼쪽 위 밝게, 오른쪽 아래 어둡게). 올리거나 읽으면 눌린 모양.
    const P = night ? BTN.night : BTN.day;
    // 모양 S 안에서, S를 조금 민 것과 겹치지 않는 띠 = 그쪽 테두리. 어떤 모양이든 같은 방식으로 명암이 생김.
    function bevelRect(x0, y0, w, h, P, pressed, lit) {
      const t = Math.max(3, Math.min(w, h) * 0.13);
      const L = pressed ? P.right : P.top, T = pressed ? P.bottom : P.top;
      const R = pressed ? P.top : P.right, D = pressed ? P.top : P.bottom;
      ctx.fillStyle = lit ? P.lit : (pressed ? P.down : P.face); ctx.fillRect(x0, y0, w, h);
      ctx.fillStyle = R; ctx.fillRect(x0 + w - t, y0, t, h);
      ctx.fillStyle = L; ctx.fillRect(x0, y0, t, h - t);
      ctx.fillStyle = D; ctx.fillRect(x0, y0 + h - t, w, t);
      ctx.fillStyle = T; ctx.fillRect(x0, y0, w - t, t);
    }
    for (const n of nodes) {
      const fs = W < 600 ? n.size - 1 : n.size, r = fs * 0.95;
      const lit = simT - n.last < 0.28 || simT - (n.dreamT || -9) < 0.9;
      const held = n === hover;
      const pressed = held || n.mem > 0;
      const isNear = near.has(n.id);
      const K = KINDS[n.kind], bw = Math.max(Math.round(fs * 1.9), Math.round(r * K.w * n.jw)), bh = Math.max(Math.round(fs * 1.55), Math.round(r * K.h * n.jh));
      n.bw = bw; n.bh = bh;
      const x0 = Math.round(n.x - bw / 2), y0 = Math.round(n.y - bh / 2);
      if (n.kind === 'data') bevelRect(x0 + 4, y0 - 4, bw, bh, P, pressed, false);   // 뒤에 겹친 종이
      bevelRect(x0, y0, bw, bh, P, pressed, lit);
      const edge = P.bottom;
      if (n.kind === 'meta') {                    // 노선도 역 표시의 눈금
        const t = r * 0.5; ctx.beginPath();
        ctx.moveTo(x0 - t, n.y); ctx.lineTo(x0, n.y); ctx.moveTo(x0 + bw, n.y); ctx.lineTo(x0 + bw + t, n.y);
        ctx.moveTo(n.x, y0 - t); ctx.lineTo(n.x, y0); ctx.moveTo(n.x, y0 + bh); ctx.lineTo(n.x, y0 + bh + t);
        ctx.strokeStyle = edge; ctx.lineWidth = 1; ctx.stroke();
      }
      if (n.kind === 'q') {                       // 질문은 이중 테두리
        ctx.strokeStyle = edge; ctx.lineWidth = 1; ctx.strokeRect(x0 - 4.5, y0 - 4.5, bw + 9, bh + 9);
      }
      const off = pressed ? 1 : 0;
      ctx.font = `${lit || held || isNear ? 600 : 400} ${fs}px ${MONO}`;
      ctx.fillStyle = lit ? P.litText : P.text;
      ctx.fillText(n.label, n.x + off, n.y + 0.5 + off);
    }
  }

  // ── 노트 문서 ───────────────────────────────
  const seen = new Set();
  try { JSON.parse(localStorage.getItem('lights-out-room:seen') || '[]').forEach(i => seen.add(i)); } catch (_) {}
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function inline(s) {
    return esc(s).replace(LINK_RE, (m, txt, id) => {
      const t = +id, d = deg[t];
      const sup = d >= HUB ? `<sup title="링크 ${d}개">${d}</sup>` : '';
      return `<a href="#d${t}" data-doc="${t}"${seen.has(t) ? ' class="seen"' : ''}>${txt}</a>${sup}`;
    });
  }
  function bodyHTML(b) {
    return b.split(/\n\s*\n/).map(block => {
      const lines = block.split('\n');
      if (lines.every(l => l.startsWith('- '))) return '<ul>' + lines.map(l => '<li>' + inline(l.slice(2)) + '</li>').join('') + '</ul>';
      return '<p>' + lines.map(inline).join('<br>') + '</p>';
    }).join('');
  }
  const docLink = j => `<a href="#d${j}" data-doc="${j}"${seen.has(j) ? ' class="seen"' : ''}>${pad(j)}. ${esc(DOCS[j].t)}</a>`;
  function pageHTML(i, mini) {
    const d = DOCS[i];
    let h = '';
    if (!mini) h += `<p><a href="#room">← 방으로 돌아가기</a> &nbsp; 노트 ${pad(i)} / ${pad(N - 1)} &nbsp; 종류: ${KINDS[KIND[i]].name} (${KINDS[KIND[i]].mark})</p>`;
    h += `<h1>${esc(d.t)}</h1>` + bodyHTML(d.b);
    if (mini) return h;
    h += '<hr>';
    h += `<p>나가는 링크 ${outLinks[i].length}개 · 들어오는 링크 ${inLinks[i].length}개</p>`;
    if (inLinks[i].length) h += `<p>여기로 오는 노트:<br>${inLinks[i].map(docLink).join('<br>')}</p>`;
    if (d.src) h += `<p>출처: ${d.src.map(([t, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>`).join(', ')}</p>`;
    return h;
  }

  const docEl = document.getElementById('doc');
  function route() {
    const m = location.hash.match(/^#d(\d+)$/);
    hideThumb();
    if (m && +m[1] < N) {
      const i = +m[1];
      seen.add(i);
      try { localStorage.setItem('lights-out-room:seen', JSON.stringify([...seen])); } catch (_) {}
      docEl.innerHTML = pageHTML(i, false);
      docEl.hidden = false;
      docEl.scrollTop = 0;
      document.title = `${DOCS[i].t} · 불 꺼진 방`;
      hover = null;
      fire(nodes[i]);                            // 읽힌 노트는 한 번 발화함
      remember(i);                               // 그리고 읽은 길에 남음
    } else {
      docEl.hidden = true;
      document.title = '불 꺼진 방';
    }
  }
  window.addEventListener('hashchange', route);
  const openDoc = i => { location.hash = 'd' + i; };

  // ── 썸네일 ─────────────────────────────────
  const thumb = document.getElementById('thumb'), thumbInner = document.getElementById('thumbInner');
  let thumbId = -1;
  function showThumb(i, x, y) {
    if (thumbId !== i) { thumbInner.innerHTML = pageHTML(i, true); thumbId = i; }
    thumb.hidden = false;
    const w = 223, h = 170;
    let left = x + 18, topY = y + 18;
    if (left + w > window.innerWidth - 8) left = x - w - 18;
    if (topY + h > window.innerHeight - 8) topY = y - h - 18;
    thumb.style.left = Math.max(8, left) + 'px';
    thumb.style.top = Math.max(8, topY) + 'px';
  }
  function hideThumb() { thumb.hidden = true; thumbId = -1; }

  docEl.addEventListener('mouseover', ev => {
    const a = ev.target.closest('a[data-doc]');
    if (a) showThumb(+a.dataset.doc, ev.clientX, ev.clientY);
  });
  docEl.addEventListener('mousemove', ev => {
    const a = ev.target.closest('a[data-doc]');
    if (a) showThumb(+a.dataset.doc, ev.clientX, ev.clientY); else hideThumb();
  });
  docEl.addEventListener('mouseleave', hideThumb);

  // ── HUD ─────────────────────────────────────
  const $ = id => document.getElementById(id);
  const lampBtn = $('lampBtn'), rulesBtn = $('rulesBtn');
  function renderDream() {
    const el = $('dream');
    if (!sent.length) { el.hidden = true; return; }
    el.innerHTML = sent.map(x => x.read ? `<b>${esc(x.w)}</b>` : x.odd ? `<span class="noise">${esc(x.w)}</span>` : esc(x.w)).join(' ') + (sentDone ? '.' : ' …');
    el.hidden = false;
  }
  function wordTick() {
    if (simT < nextWordT) return;
    if (!wq.length) { if (simT > nextWordT + 1.0) wq.push(Math.floor(Math.random() * N)); else return; }   // 조용할 땐 아무 번호나 떠오름
    const id = wq.shift(), list = WORDS[id];
    if (!list.length) return;
    if (sentDone) { sent = []; sentDone = false; sentLen = 5 + Math.floor(Math.random() * 6); }
    const k = Math.floor(Math.random() * list.length), span = Math.random() < 0.35 ? 2 : 1;
    const read = nodes[id].mem > 0, odd = night && dream && !read;
    for (const w of list.slice(k, k + span)) sent.push({ w, read, odd });
    if (sent.length >= sentLen) { sentDone = true; nextWordT = simT + 1.6; wq.length = 0; }
    else nextWordT = simT + 0.45 + Math.random() * 0.4;
    renderDream();
  }
  $('kinds').textContent = Object.values(KINDS).map(k => k.name + ' = ' + k.mark).join(' · ');
  $('index').innerHTML = DOCS.map((d, i) => `<li><span class="n">${pad(i)}</span><a href="#d${i}">${esc(d.t)}</a></li>`).join('');
  let toastTimer = 0;
  function toast(msg, ms = 4200) {
    const el = $('toast'); el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, ms);
  }

  function setNight(on, quiet) {
    if (night === on) return;
    night = on;
    document.body.classList.toggle('night', on);
    lampBtn.setAttribute('aria-label', on ? '전등: 불 켜기' : '전등: 불 끄기');
    if (on) { nightSince = simT; firesNight = 0; askedThisNight = false; dream = null; buildDream(); }
    else {
      dream = null;
      hideAsk(true);
      if (rules) nodes.forEach(n => { const a = Math.random() * Math.PI * 2; n.vx = Math.cos(a) * 260 * SPEED; n.vy = Math.sin(a) * 260 * SPEED; });
    }
    renderDream();
  }

  // 불 끄고 조금 지나면 뜨는 세 문장. 뜰 때마다 다섯 벌 중 하나를 고름.
  const ASKS = [
    ['초파리는 꿈을 꿉니다...', '초파리는 그냥 깜빡입니다...', '초파리는 여기 없습니다...'],
    ['초파리는 낮을 다시 봅니다...', '초파리는 잡음을 냅니다...', '초파리는 꺼졌습니다...'],
    ['초파리는 잠들었습니다...', '초파리는 혼자 켜졌다 꺼집니다...', '초파리는 처음부터 없었습니다...'],
    ['초파리는 읽은 길을 다시 걷습니다...', '초파리는 계산만 합니다...', '초파리는 배선일 뿐입니다...'],
    ['초파리는 무언가를 기억합니다...', '초파리는 숫자를 셉니다...', '초파리는 대답하지 않습니다...'],
  ];
  const VOTES = ['dream', 'noise', 'none'];
  let lastAsk = -1, askTimer = 0;
  function showAsk() {
    let k; do { k = Math.floor(Math.random() * ASKS.length); } while (k === lastAsk && ASKS.length > 1);
    lastAsk = k;
    clearTimeout(askTimer);
    $('opts').innerHTML = ASKS[k].map((t, i) => `<button class="txt" data-v="${VOTES[i]}">${t}</button>`).join('');
    const a = $('ask'); a.classList.remove('gone'); a.hidden = false;
  }
  function hideAsk(now) {
    clearTimeout(askTimer);
    const a = $('ask');
    if (now) { a.hidden = true; a.classList.remove('gone'); return; }
    a.classList.add('gone');
    askTimer = setTimeout(() => { a.hidden = true; a.classList.remove('gone'); }, 2900);
  }
  $('ask').addEventListener('click', ev => {
    const b = ev.target.closest('button');
    if (!b || $('ask').classList.contains('gone')) return;
    $('opts').querySelectorAll('button').forEach(x => { if (x !== b) x.classList.add('off'); });
    try { localStorage.setItem('lights-out-room:vote', b.dataset.v); } catch (_) {}
    askTimer = setTimeout(() => hideAsk(false), 1200);   // 고른 문장만 잠깐 남았다가 스르르 사라짐
  });

  lampBtn.addEventListener('click', () => setNight(!night));

  // 규칙 끄기: 내가 짠 규칙을 다 끄고 배선과 발화만 남김
  function setRules(on) {
    rules = on;
    rulesBtn.setAttribute('aria-pressed', String(!on));
    if (on) {
      if (!night) nodes.forEach(n => { const a = Math.random() * Math.PI * 2; n.vx = Math.cos(a) * 260 * SPEED; n.vy = Math.sin(a) * 260 * SPEED; });
      if (night && !dream) buildDream();
    } else {
    }
    renderDream();
  }
  rulesBtn.addEventListener('click', () => setRules(!rules));
  $('forgetBtn').addEventListener('click', () => { forgetPath(); toast('비웠음', 1600); });

  const closeInfo = () => { $('info').hidden = true; $('infoBtn').setAttribute('aria-expanded', 'false'); };
  $('infoBtn').addEventListener('click', () => {
    const p = $('info'); p.hidden = !p.hidden;
    $('infoBtn').setAttribute('aria-expanded', String(!p.hidden));
  });
  $('index').addEventListener('click', ev => { if (ev.target.closest('a')) closeInfo(); });
  window.addEventListener('keydown', ev => {
    if (!docEl.hidden) { if (ev.key === 'Escape') location.hash = 'room'; return; }
    if (ev.key === 'l' || ev.key === 'L') setNight(!night);
    if (ev.key === 'Escape') closeInfo();
  });

  // ── 방 안의 포인터 ──────────────────────────
  function nodeAt(x, y, touch) {
    let best = null, bd = Infinity;
    for (const n of nodes) {
      const rx = Math.max(touch ? 24 : 0, (n.bw || n.size * 2) / 2 + 2), ry = Math.max(touch ? 22 : 0, (n.bh || n.size * 2) / 2 + 2);
      const dx = Math.abs(n.x - x), dy = Math.abs(n.y - y);
      if (dx < rx && dy < ry) { const d = dx + dy; if (d < bd) { bd = d; best = n; } }
    }
    return best;
  }
  cvs.addEventListener('pointermove', ev => {
    if (ev.pointerType !== 'mouse') return;
    const n = nodeAt(ev.clientX, ev.clientY, false);
    if (n !== hover) { hover = n; hoverEmit = simT - 10; hoverStart = performance.now(); hoverLogged = false; if (n) connectHover(); }
    cvs.classList.toggle('on-node', !!n);
    if (n) showThumb(n.id, ev.clientX, ev.clientY); else hideThumb();
  });
  cvs.addEventListener('pointerleave', () => { hover = null; cvs.classList.remove('on-node'); hideThumb(); });
  cvs.addEventListener('pointerdown', ev => {
    closeInfo();
    const x = ev.clientX, y = ev.clientY;
    const n = nodeAt(x, y, ev.pointerType !== 'mouse');
    if (n) { openDoc(n.id); return; }
    if (night) return;
    ripples.push({ x, y, t0: simT });
    for (const m of nodes) {
      const dx = m.x - x, dy = m.y - y, d = Math.hypot(dx, dy);
      if (d < 150) {
        m.v += 1.3 * (1 - d / 150);
        if (!rules) continue;                    // 규칙이 없으면 빛은 전압만 올림
        const k = (1 - d / 150) * 420 * SPEED / (d || 1);
        m.vx += dx * k; m.vy += dy * k;          // 놀라서 흩어짐
      }
    }
  });

  // ── 아무도 보지 않는 동안 ────────────────────
  let hiddenAt = null;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      hiddenAt = performance.now();
      hover = null; hideThumb();
    } else if (hiddenAt !== null) {
      const away = Math.min(240, (performance.now() - hiddenAt) / 1000);
      hiddenAt = null;
      const before = fires;
      for (let t = 0; t < away; t += 0.05) step(0.05, false);   // 비운 시간만큼 방을 실제로 돌림
      spikes.length = 0;
      renderDream();
      toast(`${Math.round(away)}초 비운 사이 ${fires - before}번 깜빡였음`, 5000);
    }
  });

  // ── 루프 ────────────────────────────────────
  let prev = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
    step(dt, true);
    if (docEl.hidden) draw();
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', resize);
  resize();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
  loadPath();
  route();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
